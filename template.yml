AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Template SIMPLIFICADO para testes locais sem auth

Resources:
  MockLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./bin/
      Handler: bootstrap
      Runtime: provided.al2
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          LOG_LEVEL: "DEBUG"
          CONFIG_SOURCE: "./config.yaml" # Arquivo local
          APP_ENV: "local"
      Events:
        UserApi:
          Type: Api
          Properties:
            Path: /users/{username} # Note o nome do parâmetro
            Method: POST

# Configurações do SAM Local
Metadata:
  SamLocal:
    MockLambdaFunction:
      SkipPullImage: true # Não precisa baixar imagem Docker
      DockerNetwork: host # Acessa serviços locais
